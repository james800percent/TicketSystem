<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugTracker - Ticket System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>BugTracker</h1>
            </div>
            <div class="header-actions">
                <div class="stats">
                    <span class="stat" id="openCount">Open: 0</span>
                    <span class="stat" id="resolvedCount">Resolved: 0</span>
                </div>
                <button id="addTicketBtn" class="primary-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                    New Ticket
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Controls toolbar: Search & Filter -->
        <div class="toolbar">
            <div class="search-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="search-icon" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                <input type="text" id="searchInput" placeholder="Search tickets by title or ID..." autocomplete="off">
            </div>
            <div class="filters">
                <select id="statusFilter" class="dropdown">
                    <option value="All">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="Resolved">Resolved</option>
                </select>
                <select id="priorityFilter" class="dropdown">
                    <option value="All">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div id="ticketGrid" class="grid">
            <!-- Ticket Cards injected here -->
        </div>

        <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">✓</div>
            <h3>All clear!</h3>
            <p>No tickets found. You are all caught up!</p>
            <button id="emptyAddBtn" class="secondary-btn">Report an Issue</button>
        </div>
    </main>

    <!-- Add Ticket Modal -->
    <div id="ticketModal" class="modal hidden">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2>Create New Ticket</h2>
                <button id="closeModalBtn" class="icon-btn" aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body">
                <form id="ticketForm">
                    <div class="input-group">
                        <label for="ticketTitle">Issue Title</label>
                        <input type="text" id="ticketTitle" placeholder="e.g. Login button unresponsive on mobile" autocomplete="off" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group half">
                            <label for="ticketPriority">Priority</label>
                            <select id="ticketPriority" required>
                                <option value="Low">Low (Minor)</option>
                                <option value="Medium" selected>Medium (Standard)</option>
                                <option value="High">High (Critical)</option>
                            </select>
                        </div>
                        <div class="input-group half">
                            <label for="ticketReporter">Reporter Name</label>
                            <input type="text" id="ticketReporter" placeholder="Your Name" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="input-group flex-fill">
                        <label for="ticketDescription">Description & Steps to Reproduce</label>
                        <textarea id="ticketDescription" placeholder="1. Go to page...&#10;2. Click on...&#10;3. Expected... but got..." required></textarea>
                    </div>

                    <div class="modal-footer">
                        <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
                        <button type="submit" id="saveTicketBtn" class="primary-btn glow">Submit Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
